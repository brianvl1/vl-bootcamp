<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Victory Lap — Prospecting Bootcamp for AEBetancourt</title>
  <meta name="description" content="Victory Lap's proven prospecting bootcamp, customized for AEBetancourt. Cold call mastery, executive-level email writing, value-add cadence, AIR objection handling, and behavioral psychology built into every framework." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0B1C35; font-family: 'DM Sans', system-ui, sans-serif; }
    button { font-family: inherit; }
    a { cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const C = {
      navy: "#0B1C35", navyLight: "#142640",
      teal: "#00B4A6", tealLight: "rgba(0,180,166,0.12)", tealBorder: "rgba(0,180,166,0.28)",
      amber: "#F5A623", amberLight: "rgba(245,166,35,0.12)", amberBorder: "rgba(245,166,35,0.3)",
      red: "#E5484D", redLight: "rgba(229,72,77,0.12)", redBorder: "rgba(229,72,77,0.3)",
      white: "#FFFFFF", muted: "rgba(255,255,255,0.5)", faint: "rgba(255,255,255,0.06)", border: "rgba(255,255,255,0.08)",
    };

    const vlProof = [
      { stat: "10+", label: "Years coaching and developing B2B sellers" },
      { stat: "1,000+", label: "Sellers placed at high-growth companies" },
      { stat: "400+", label: "Client companies served" },
      { stat: "85+", label: "Bootcamp NPS score" },
    ];

    const clients = ["Ncontracts", "Uscreen", "Filevine", "Vizit", "300+ More"];

    const frameworks = [
      { id: "cadence", tag: "Cadence Framework", title: "Educate. Differentiate. Validate.", color: C.teal, colorLight: C.tealLight, colorBorder: C.tealBorder,
        subtitle: "A three-touch value-add cadence rhythm that earns the right to a conversation by leading with insight at every step.",
        steps: [
          { label: "Educate", desc: "Lead with an insight the prospect has not considered. Share a market trend, a benchmark, or a data point relevant to their specific role and hiring situation. The goal is to be worth reading before asking for anything. This touch positions AEB as a strategic partner, not a vendor.", psych: "Reciprocity. When you give something of genuine value first, prospects feel a natural pull to give something back — starting with their attention." },
          { label: "Differentiate", desc: "Make a direct, specific case for why AEB's recruiting-as-a-service model is different from every traditional firm they have worked with. Not a features list. One concrete differentiator tied to a result: no percentage-based fees, full pipeline transparency, a candidate scorecard built around their definition of perfect-fit, and a database of qualified candidates they keep even after the first placement.", psych: "Loss Aversion. Frame what they are currently losing by staying with a transactional recruiting model. The cost of a wrong hire, the opacity of a commission-based firm, the lack of a lasting candidate pool." },
          { label: "Validate", desc: "Bring social proof. A named client in a similar industry. A specific placement outcome. A retention result. A testimonial from a hiring leader who had the same hesitation about switching from a traditional agency. This touch reduces perceived risk and makes the decision to engage feel safe and well-supported.", psych: "Social Proof. Decision-makers look to what peers in similar roles have done. Proof from a company like theirs carries more weight than any claim AEB makes about itself." },
        ]
      },
      { id: "email", tag: "Email Framework", title: "Executive-Level Prospecting Email", color: C.amber, colorLight: C.amberLight, colorBorder: C.amberBorder,
        subtitle: "Every email is written at the level of the executive receiving it. Precise, personalized, outcome-focused, and built around one specific observation — never a template with a name swapped in.",
        steps: [
          { label: "Subject Line", desc: "One observation or question tied to their specific company, role, or a recent signal. Under 7 words. No 'quick question' or 'following up.' The subject line must earn the open by creating genuine curiosity. Examples: 'Your six open leadership roles on LinkedIn.' 'After your Series B.' 'A different take on your hiring process.'", psych: "Pattern Interrupt. A subject line that references their exact situation breaks the mental filter that deletes generic outreach. Executives delete in under two seconds — specificity is the only defense." },
          { label: "Executive-Level Opener", desc: "One sentence that proves you did homework — and writes at the level of the person reading it. Reference a trigger event, a company milestone, a leadership transition, or a growth signal. Never start with 'I' or 'My name is.' Start with them. Executives respond to precision, not pleasantries. Example: 'Saw that AEBetancourt just expanded into succession planning and leadership development — a significant shift that typically accelerates the need for a more structured talent acquisition process.'", psych: "Endowment Effect. When an executive sees their own specific context reflected back with precision, they feel ownership over the conversation and are far less likely to dismiss it as a vendor email." },
          { label: "One Business Outcome", desc: "One sentence. Write it at the level of a CFO or COO, not a recruiter. The result AEB produces, not the service it offers. Tie it to revenue impact, retention rates, or time-to-productivity. Example: 'We help growing firms like yours eliminate the 20% placement fee while building a candidate pipeline your team owns — leading to faster hires, better retention, and zero dependency on recurring agency fees.'", psych: "Loss Aversion. Quantify what they are losing right now: fees, opacity, wrong hires, turnover costs. Executives respond to financial framing far more than feature descriptions." },
          { label: "Social Proof", desc: "One sentence naming a comparable organization or outcome. Match the industry or company stage as closely as possible. Example: 'Ncontracts, Filevine, and Vizit have all used AEB's recruiting-as-a-service model to reduce time-to-hire and build lasting candidate pipelines without the traditional agency fees.'", psych: "Social Proof. Peer validation from recognizable names in their category converts executive skepticism into curiosity faster than any direct claim about AEB's process." },
          { label: "Single Low-Friction CTA", desc: "One ask. Written at the executive's pace — not a salesperson's urgency. Make it easy to say yes without feeling pressured. Examples: 'Worth a 15-minute call to walk through how we structured this for a firm like yours?' or 'Would it make sense to share our Perfect-Fit Process overview before we connect?'", psych: "Commitment. A small yes creates psychological momentum toward a larger yes. Executives who agree to a 15-minute conversation are already invested. Do not overload the first touch with multiple asks or attachments." },
        ]
      },
      { id: "coldcall", tag: "Cold Call Framework", title: "4-Step Cold Call Opener", color: C.teal, colorLight: C.tealLight, colorBorder: C.tealBorder,
        subtitle: "A repeatable, rubric-scored opener that establishes credibility, sounds nothing like a cold call, and earns the next 60 seconds.",
        steps: [
          { label: "Step 1. Permission-Based Open", desc: "Introduce yourself, state a brief reason for calling, and ask for permission to continue. Do not pitch. Do not ask 'How are you today?' Respect their time from the first word. Example: 'This is [Name] from Victory Lap. I know I caught you out of the blue — I have a quick reason for calling. Do you have 30 seconds?'", psych: "Reciprocity. Asking permission rather than assuming it creates a micro-agreement that makes the prospect more receptive to everything that follows." },
          { label: "Step 2. Social Proof Statement", desc: "One sentence establishing credibility before making any ask. Reference who you work with, not what you do. Name a peer company they would recognize. Example: 'We work with talent consulting and executive search firms. Most recently we ran a prospecting bootcamp for a firm like AEB that moved their outbound meeting rate by 40% in 90 days.'", psych: "Social Proof and Authority. Naming a peer company signals legitimacy instantly and bypasses the default skepticism a cold caller faces in the first 15 seconds." },
          { label: "Step 3. Engaging Question", desc: "One open-ended problem question tied to a challenge that matters to their specific role. Not a product question. A diagnostic question. Example for AEB Business Development Consultants: 'When your BDCs are struggling to book discovery meetings, is the bigger issue the quality of the target list, the messaging in the outreach, or the actual conversation skill on the cold call?' Let them answer. Do not interrupt.", psych: "Endowment Effect and Commitment. When a prospect answers a diagnostic question, they invest in the conversation and feel partial ownership over where it goes next." },
          { label: "Step 4. Bridge to Next Step", desc: "Connect their answer directly to a specific outcome AEB can help with. Then make one clear, low-pressure ask for a meeting. Example: 'That tracks exactly with what we hear. We have a framework built specifically for that gap. Would it be worth 15 minutes to walk you through how we approached it for a similar firm?'", psych: "Scarcity and Loss Aversion. Frame the meeting as a chance to close a specific, named gap — not a demo, not a pitch. A targeted solution to the exact problem they just described." },
        ]
      },
      { id: "objection", tag: "Objection Handling Framework", title: "Acknowledge. Identify. Respond.", color: C.amber, colorLight: C.amberLight, colorBorder: C.amberBorder,
        subtitle: "A three-step process for navigating resistance without losing ground, sounding defensive, or abandoning the conversation.",
        steps: [
          { label: "Step 1. Acknowledge", desc: "Validate the objection before responding to it. Do not immediately counter. Do not defend. Show that you heard them and that the concern is reasonable. Example: 'That makes complete sense — most of the leaders we work with said the same thing before we connected.' This disarms resistance before it can escalate into a hard no.", psych: "Reciprocity. Acknowledging someone's concern before countering it signals respect. People are far more open to a response from someone who first made them feel genuinely understood." },
          { label: "Step 2. Identify", desc: "Ask a clarifying question to find the real objection underneath the stated one. Most surface objections are proxies for something deeper. 'Send me info' usually means 'I am not convinced yet.' 'The timing is not right' often means 'I do not see enough value to prioritize this.' Example: 'Can I ask — when you say the timing is not right, is it more of a budget issue, a bandwidth issue, or is this just not a priority for you right now?' Identify before you respond.", psych: "Commitment. When a prospect clarifies their own objection, they engage more deeply in the conversation and often talk themselves closer to a yes without any additional persuasion." },
          { label: "Step 3. Respond", desc: "Respond specifically to what they actually said — not what you assumed they meant. Use social proof from a comparable firm where possible. Tie your response to the business outcome they care about. Then redirect to a concrete next step. Example: 'Given that it is really a bandwidth issue, that is exactly why firms like Filevine brought us in. We do not add to your plate — we run the training and hand you a repeatable playbook. Would a 20-minute call to show you how we structured it be worth it?'", psych: "Social Proof and Scarcity. A named peer company that had the same objection and moved forward is the most persuasive response available. Pair it with the cost of continued inaction." },
        ]
      },
      { id: "gatekeeper", tag: "Gatekeeper Framework", title: "Gatekeeper Intel Gathering", color: C.teal, colorLight: C.tealLight, colorBorder: C.tealBorder,
        subtitle: "Treat the gatekeeper as a resource, not an obstacle. They often know more about the decision-maker's priorities than the public-facing profile reveals.",
        steps: [
          { label: "Do Not Lie. Do Not Dodge.", desc: "State your name and company clearly. Gatekeepers are trained to detect evasion and vagueness. Confidence without aggression is the right register. Example: 'This is [Name] from Victory Lap. I am hoping to connect with [Decision-Maker].' You are not hiding anything. You are a professional calling about a professional matter.", psych: "Authority and Reciprocity. Gatekeepers respond to professionalism. Treating them with direct respect opens doors that pushiness and evasion consistently close." },
          { label: "Gather Before You Ask", desc: "Before asking to be transferred, use the gatekeeper to confirm or learn: the best time to reach the decision-maker, their direct line or preferred contact method, whether they own the relevant hiring or training decisions or if someone else is involved, and whether there is a current vendor relationship you should know about. Frame it as coordination, not interrogation.", psych: "Reciprocity. Asking for their help rather than demanding a transfer positions you as respectful and collaborative. Gatekeepers who feel valued share substantially more than gatekeepers who feel bypassed." },
          { label: "Leave an Intel-Informed Voicemail", desc: "If you cannot get through, use what you learned to leave a voicemail that sounds specific to their company. Reference the company by name. Reference a real challenge or context point. Keep it under 20 seconds and end with one clear callback ask. Example: 'This is [Name] from Victory Lap. I work with talent consulting firms on business development skill development. Given the growth AEB has been on and the expansion into new service lines, I thought a quick conversation might be worth it. I will try again Thursday. You can reach me at [number].'", psych: "Scarcity and Social Proof. A voicemail that references specifics about their company signals you are not dialing from a list. It creates genuine curiosity about how you know what you know." },
        ]
      },
    ];

    const psych = [
      { principle: "Reciprocity", application: "Lead every cadence touch with value before making any ask. Give an insight, a benchmark, or a named proof point. Prospects who receive genuine value first feel a natural pull to give something back — starting with their time and attention." },
      { principle: "Social Proof", application: "Name companies like theirs that have seen results with AEB's model. Ncontracts, Filevine, Uscreen, and Vizit are proof points that reduce perceived risk and convert executive skepticism into curiosity faster than any direct claim." },
      { principle: "Loss Aversion", application: "Frame the cost of inaction on every differentiating touch and on cold calls. Executives avoid losses more strongly than they pursue gains. Quantify the cost of the gap — wrong hires, agency fees, lack of candidate pipeline ownership — not just the value of the solution." },
      { principle: "Scarcity", application: "Reference timing as a real factor tied to their specific context. A leadership transition, a hiring surge, or an expansion into a new service line creates a window that is genuinely time-sensitive. Urgency tied to their reality is legitimate. Manufactured urgency is not." },
      { principle: "Endowment Effect", application: "Personalize every touch so specifically that the executive feels the outreach was built for them. When people see their own context reflected back with precision, they feel ownership over the conversation and are far less likely to dismiss it as generic vendor outreach." },
      { principle: "Commitment", application: "Use the engaging question on cold calls to get a small yes before asking for a meeting. When prospects answer a diagnostic question, they invest in the conversation. Small commitments create psychological momentum toward larger ones." },
    ];

    const heatmapSkills = [
      { skill: "Cold Call Opening", score: 2, zone: "hot" },
      { skill: "Value-Add Cadence", score: 2, zone: "hot" },
      { skill: "Executive Email Writing", score: 2, zone: "hot" },
      { skill: "Gatekeeper Nav", score: 3, zone: "warm" },
      { skill: "AIR Objections", score: 2, zone: "hot" },
      { skill: "Advisor Tone", score: 3, zone: "warm" },
      { skill: "Strategic Follow-Up", score: 2, zone: "hot" },
      { skill: "Referral Asks", score: 2, zone: "hot" },
      { skill: "LinkedIn Warm Channel", score: 3, zone: "warm" },
      { skill: "Call-to-Meeting Close", score: 3, zone: "warm" },
    ];

    const sessions = [
      {
        num: "D", label: "DIAGNOSTIC", title: "Pre-Bootcamp Diagnostic", subtitle: "Virtual. Half Day. Understanding where each rep truly stands before we build anything.",
        timeframe: "Virtual Half Day. Scheduled before Session 1.", color: C.teal, colorLight: C.tealLight, colorBorder: C.tealBorder,
        agenda: [
          { time: "Week Prior", block: "Pre-Diagnostic Survey", detail: "Each participant answers 10 specific questions about their current prospecting sequence, cold call opener, email approach, and biggest confidence gaps. Answers are reviewed before the virtual session.", type: "opening" },
          { time: "Session Open", block: "CRM and Activity Audit Review", detail: "Facilitator walks through the HubSpot activity audit completed by the manager: calls logged, emails sent, sequences active, meetings booked from outbound, and source breakdown for all new opportunities. No judgment — this is a data conversation.", type: "workshop" },
          { time: "Mid Session", block: "Skills Self-Assessment", detail: "Each rep scores themselves 1 to 5 across 10 prospecting skills live during the session. Scores are collected and aggregated in real time. The heat map is built from these results and revealed at the opening of Session 1.", type: "workshop" },
          { time: "Closing", block: "Call Recording Review", detail: "Three to five recorded cold calls reviewed together. Each call is scored using the four-step cold call rubric against: opener quality, value statement, objection response, and ability to close to a next step. Patterns identified across the team.", type: "lab" },
          { time: "Wrap", block: "Diagnostic Debrief and Session 1 Preview", detail: "Facilitator summarizes the key findings, names the priority skill gaps, and previews what Session 1 will address. Each rep receives their individual heat map before the in-person sessions begin.", type: "closing" },
        ],
        outcomes: [
          "Complete picture of each rep's current prospecting approach and confidence level.",
          "Aggregate heat map built from real self-assessment data.",
          "Cold call patterns identified across the team before any training begins.",
          "Session 1 agenda prioritized around actual red zones, not assumed gaps.",
        ],
      },
      {
        num: "01", label: "SESSION", title: "Cadence, Cold Calls and Executive-Level Messaging",
        subtitle: "Build the system. Make the calls. Fix the message.",
        timeframe: "In-Person Half Day. 9:00 AM to 1:00 PM.", color: C.teal, colorLight: C.tealLight, colorBorder: C.tealBorder,
        agenda: [
          { time: "9:00 to 9:25", block: "Heat Map Reveal and Honest Baseline", detail: "Open with the aggregate diagnostic results. Name the gaps directly. Set the standard for the day: every exercise produces something usable before you walk out of this room.", type: "opening" },
          { time: "9:25 to 10:10", block: "Value-Add Cadence Workshop", detail: "Build the full Educate, Differentiate, Validate sequence tailored to AEB's buyer — CHROs, VP HR, CEOs, and COOs at growth-stage firms. Each rep maps their current outreach on paper, identifies which touches are missing a clear value layer, and rebuilds using the three-touch framework. Every rebuilt cadence gets loaded into HubSpot before the session ends. AEB's unique differentiators — no percentage-based fees, candidate scorecards, and the recruiting-as-a-service model — are embedded into the Differentiate touch.", type: "workshop" },
          { time: "10:10 to 10:50", block: "Executive-Level Email Writing Lab", detail: "Cover the five-part framework built for executive audiences. Subject line, personalized opener at the executive's level of precision, one business outcome framed in financial terms, social proof from a named comparable firm, single low-friction CTA. Each rep brings their current prospecting email. We rewrite it live in the room. Before and after read-aloud. Peers score using the email rubric. The standard is simple: would a CHRO or CEO keep reading past the second sentence?", type: "workshop" },
          { time: "10:50 to 11:05", block: "Break", detail: "", type: "break" },
          { time: "11:05 to 11:50", block: "4-Step Cold Call Opener and Gatekeeper Intel", detail: "Drill the four-step opener: permission-based open, social proof statement, engaging diagnostic question, bridge to next step. Cover gatekeeper navigation — treat as a resource, gather intel before asking for a transfer, leave an intel-informed voicemail. Role play in pairs. Each rep scores their partner on the cold call rubric: confidence, social proof placement, question quality, natural close.", type: "lab" },
          { time: "11:50 to 12:35", block: "Live Cold Call Sprint", detail: "30 minutes of live prospecting on real prospects using rebuilt cadences. Facilitator circulates and coaches in real time. Track on a shared board: calls attempted, conversations started, objections hit, meetings booked. Full debrief: what broke, what worked, one immediate fix per rep before tomorrow.", type: "lab" },
          { time: "12:35 to 1:00", block: "Homework and Day 1 Commitments", detail: "Before Session 2: send 10 emails using the new executive-level framework and log reply rates. Make 15 cold calls and log every objection in HubSpot notes. Write AEB's differentiation from a traditional agency in exactly three sentences. Bring two real objections from actual calls to Session 2.", type: "closing" },
        ],
        outcomes: [
          "Value-add cadence rebuilt and active in HubSpot with AEB's specific differentiators embedded.",
          "Current prospecting email rewritten to executive-level standard using the five-part framework.",
          "Cold call opener practiced, scored by peers, and refined using the four-step rubric.",
          "Gatekeeper navigation and intel-gathering approach drilled.",
          "15 real calls made before Session 2 with objections logged.",
        ],
      },
      {
        num: "02", label: "SESSION", title: "Advisor Selling, Objection Handling and Strategic Prospecting",
        subtitle: "Sound different. Handle anything. Build a 90-day system.",
        timeframe: "In-Person Half Day. 9:00 AM to 1:00 PM.", color: C.amber, colorLight: C.amberLight, colorBorder: C.amberBorder,
        agenda: [
          { time: "9:00 to 9:20", block: "Homework Debrief. Real Data, Real Patterns.", detail: "Review actual results from the week: email reply rates, call outcomes, objections hit. Identify the two to three things still breaking. Those drive today's depth.", type: "opening" },
          { time: "9:20 to 10:05", block: "AIR Objection Handling Clinic", detail: "Cover the three-step Acknowledge, Identify, Respond framework with the psychology behind each step. Drill the six most common AEB-specific objections in rotating pairs until the response is fluent — not memorized, fluent. We have an internal recruiter. We use a traditional agency. Send me some info. The timing is not right. What makes you different from other firms? We are not hiring right now. Each handled with a specific, tested response using the AIR framework.", type: "workshop" },
          { time: "10:05 to 10:50", block: "Advisor-Level Selling on Cold Calls", detail: "The difference between a recruiter-sounding rep and a trusted talent advisor in the first four minutes of a call. The three-question discovery sequence: a context question that proves research was done, an implication question that surfaces the cost of their current process, a vision question that gets the prospect talking about what a perfect hiring outcome would look like. Each rep practices live and is scored on whether the prospect feels diagnosed or pitched.", type: "workshop" },
          { time: "10:50 to 11:05", block: "Break", detail: "", type: "break" },
          { time: "11:05 to 11:40", block: "Strategic and Trigger-Based Prospecting", detail: "Stop cold prospecting when you can prospect warm. Trigger events that signal the right time to reach AEB's buyers: leadership change in HR or executive team, company hiring surge on LinkedIn Jobs, Series A or B funding announcement, rapid headcount growth, negative Glassdoor trend indicating culture or retention pain, org reorg announcement. How to open with a trigger instead of a generic line. Build a live trigger event watchlist for each rep's top 20 accounts with Google Alerts and LinkedIn notifications set before the session ends.", type: "content" },
          { time: "11:40 to 12:15", block: "Trust Through Follow-Up and Referral Asks", detail: "The follow-up touch that builds trust versus the one that erodes it. Share a hiring trend relevant to their industry, reference a detail from a LinkedIn post, offer a benchmark from AEB's placement data. The exact referral ask language: 'We do our best work when clients like you help us find more organizations like yours. Is there anyone in your network right now dealing with the same talent acquisition challenges you were facing before we worked together?' Practice in pairs. Each rep writes five client names and five placed candidate names who should receive a referral ask before the end of this month.", type: "workshop" },
          { time: "12:15 to 1:00", block: "90-Day Prospecting Plan and Accountability", detail: "Each rep writes their personal plan before leaving the room. Weekly activity targets, top 20 target accounts listed, trigger event watchlist live in browser, rebuilt cadence active in HubSpot, AIR objection playbook saved. Accountability partners assigned with a weekly 10-minute check-in commitment. The one number that matters above everything else: new outbound-sourced discovery meetings booked per week.", type: "closing" },
        ],
        outcomes: [
          "AIR objection framework applied fluently to six AEB-specific objections.",
          "Three-question advisory discovery sequence practiced and personalized to AEB's buyer.",
          "Trigger event watchlist built for top 20 accounts with live alerts set.",
          "Referral ask scripted and mapped to five clients and five placed candidates.",
          "Written 90-day prospecting plan with weekly targets and accountability partner named.",
        ],
      },
    ];

    function SL({ children }) {
      return <div style={{ fontFamily: "monospace", fontSize: 10, letterSpacing: 3, color: C.teal, textTransform: "uppercase", marginBottom: 18 }}>{children}</div>;
    }

    function Card({ children, style = {} }) {
      return <div style={{ background: C.faint, border: `1px solid ${C.border}`, borderRadius: 10, padding: "18px 20px", ...style }}>{children}</div>;
    }

    function Dot({ color = C.teal }) {
      return <div style={{ width: 5, height: 5, borderRadius: "50%", background: color, marginTop: 7, flexShrink: 0 }} />;
    }

    function FWCard({ fw }) {
      const [open, setOpen] = useState(false);
      return (
        <div style={{ border: `1px solid ${fw.colorBorder}`, borderRadius: 10, overflow: "hidden", marginBottom: 12 }}>
          <div onClick={() => setOpen(!open)} style={{ padding: "16px 20px", background: fw.colorLight, cursor: "pointer", display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: "monospace", fontSize: 10, letterSpacing: 2, color: fw.color, textTransform: "uppercase", marginBottom: 4 }}>{fw.tag}</div>
              <div style={{ fontWeight: 700, fontSize: 16, color: C.white }}>{fw.title}</div>
              <div style={{ fontSize: 12, color: C.muted, marginTop: 3 }}>{fw.subtitle}</div>
            </div>
            <div style={{ color: fw.color, fontSize: 16, transition: "transform 0.2s", transform: open ? "rotate(180deg)" : "none" }}>▾</div>
          </div>
          {open && (
            <div style={{ padding: "16px 20px", background: "rgba(255,255,255,0.02)", display: "flex", flexDirection: "column", gap: 12 }}>
              {fw.steps.map((step, i) => (
                <div key={i} style={{ background: C.faint, border: `1px solid ${C.border}`, borderRadius: 8, padding: "14px 16px" }}>
                  <div style={{ fontWeight: 700, fontSize: 13, color: fw.color, marginBottom: 6 }}>{step.label}</div>
                  <div style={{ fontSize: 13, color: "rgba(255,255,255,0.65)", lineHeight: 1.7, marginBottom: 8 }}>{step.desc}</div>
                  <div style={{ display: "flex", gap: 8, background: "rgba(255,255,255,0.03)", borderRadius: 6, padding: "8px 10px" }}>
                    <div style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: 1, color: C.amber, textTransform: "uppercase", marginTop: 2, flexShrink: 0 }}>Psychology</div>
                    <div style={{ fontSize: 12, color: "rgba(255,255,255,0.5)", lineHeight: 1.6 }}>{step.psych}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function HeatCell({ skill }) {
      const colors = {
        hot: { bg: C.redLight, border: C.redBorder, score: C.red, label: "PRIORITY" },
        warm: { bg: C.amberLight, border: C.amberBorder, score: C.amber, label: "SHARPEN" },
        cool: { bg: C.tealLight, border: C.tealBorder, score: C.teal, label: "MAINTAIN" },
      };
      const col = colors[skill.zone];
      return (
        <div style={{ background: col.bg, border: `1px solid ${col.border}`, borderRadius: 8, padding: "12px 8px", textAlign: "center" }}>
          <div style={{ fontSize: 10, fontWeight: 700, color: C.white, marginBottom: 5, lineHeight: 1.3 }}>{skill.skill}</div>
          <div style={{ fontFamily: "monospace", fontSize: 28, fontWeight: 800, color: col.score, lineHeight: 1 }}>{skill.score}</div>
          <div style={{ fontSize: 8, letterSpacing: 1, textTransform: "uppercase", marginTop: 3, color: col.score, opacity: 0.8 }}>{col.label}</div>
        </div>
      );
    }

    function ARow({ item }) {
      const cfg = { opening: { bg: "rgba(100,100,255,0.07)", dot: "#8888FF" }, content: { bg: "rgba(255,255,255,0.03)", dot: C.muted }, workshop: { bg: "rgba(0,180,166,0.06)", dot: C.teal }, lab: { bg: "rgba(245,166,35,0.06)", dot: C.amber }, closing: { bg: "rgba(100,100,255,0.05)", dot: "#8888FF" }, break: { bg: "transparent", dot: "transparent" } };
      const s = cfg[item.type] || cfg.content;
      if (item.type === "break") return (
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 0", opacity: 0.3 }}>
          <div style={{ fontFamily: "monospace", fontSize: 10, color: C.muted, width: 100, flexShrink: 0 }}>{item.time}</div>
          <div style={{ flex: 1, height: 1, background: C.border }} />
          <div style={{ fontSize: 10, color: C.muted }}>Break</div>
          <div style={{ flex: 1, height: 1, background: C.border }} />
        </div>
      );
      return (
        <div style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 12px", background: s.bg, borderRadius: 7 }}>
          <div style={{ fontFamily: "monospace", fontSize: 10, color: C.muted, width: 110, flexShrink: 0, paddingTop: 2 }}>{item.time}</div>
          <div style={{ width: 5, height: 5, borderRadius: "50%", background: s.dot, marginTop: 6, flexShrink: 0 }} />

            <div style={{ fontWeight: 700, fontSize: 13, color: C.white, marginBottom: 2 }}>{item.block}</div>

          </div>
        </div>
      );
    }

    function SCard({ session }) {
      const [open, setOpen] = useState(true);
      const isDiag = session.num === "D";
      return (
        <div style={{ border: `1px solid ${session.colorBorder}`, borderRadius: 12, overflow: "hidden", marginBottom: 20 }}>
          <div onClick={() => setOpen(!open)} style={{ padding: "20px 24px", background: session.colorLight, cursor: "pointer", display: "flex", alignItems: "center", gap: 16 }}>
            <div style={{ fontFamily: "monospace", fontSize: isDiag ? 32 : 46, fontWeight: 800, color: session.color, lineHeight: 1, opacity: 0.7, minWidth: 50 }}>{session.num}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: session.color, marginBottom: 4 }}>{session.label}</div>

                  </div>

            </div>
