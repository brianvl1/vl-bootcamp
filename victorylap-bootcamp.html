<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Victory Lap — Prospecting Bootcamp</title>
  <meta name="description" content="Victory Lap's proven prospecting bootcamp. EDV cadence, cold call mastery, AIR objection handling, and behavioral psychology built into every framework." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0B1C35; font-family: 'DM Sans', system-ui, sans-serif; }
    button { font-family: inherit; }
    a { cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const C = {
      navy: "#0B1C35", navyLight: "#142640",
      teal: "#00B4A6", tealLight: "rgba(0,180,166,0.12)", tealBorder: "rgba(0,180,166,0.28)",
      amber: "#F5A623", amberLight: "rgba(245,166,35,0.12)", amberBorder: "rgba(245,166,35,0.3)",
      red: "#E5484D", redLight: "rgba(229,72,77,0.12)", redBorder: "rgba(229,72,77,0.3)",
      white: "#FFFFFF", muted: "rgba(255,255,255,0.5)", faint: "rgba(255,255,255,0.06)", border: "rgba(255,255,255,0.08)",
    };

    const vlProof = [
      { stat: "10+", label: "Years coaching and developing B2B sellers" },
      { stat: "1,000+", label: "Sellers placed at high-growth companies" },
      { stat: "400+", label: "Client companies served" },
      { stat: "9+", label: "Average bootcamp NPS score" },
    ];

    const clients = ["Enverus", "FilVine", "Uscreen"];

    const frameworks = [
      { id: "edv", tag: "Cadence Framework", title: "Educate. Differentiate. Validate.", color: C.teal, colorLight: C.tealLight, colorBorder: C.tealBorder,
        subtitle: "The three-touch value-add cadence rhythm that earns the right to a conversation.",
        steps: [
          { label: "Educate", desc: "Lead with an insight the prospect has not considered. Share a market trend, a benchmark, or a data point relevant to their role. The goal is to be worth reading before asking for anything. This touch triggers curiosity and positions you as someone who brings value, not just requests it.", psych: "Reciprocity. When you give something of value first, prospects feel a natural pull to give something back." },
          { label: "Differentiate", desc: "Make a direct, specific case for why your firm is different from every other option they have spoken with. Not a features list. One concrete differentiator tied to a result. Focus on your unique methodology, process, and the outcomes clients experience that generic alternatives cannot replicate.", psych: "Loss Aversion. Frame what they are currently missing. The pain of a wrong hire or an underperforming rep costs multiples of what they are paying now." },
          { label: "Validate", desc: "Bring social proof. A named client in a similar industry. A specific outcome. A retention stat. A testimonial from a leader who had the same hesitation. This touch reduces perceived risk and makes the decision to engage feel safe.", psych: "Social Proof. Decision-makers look to what peers in similar roles have done. Proof from a company like theirs carries more weight than any claim you make about yourself." },
        ]
      },
      { id: "email", tag: "Email Framework", title: "Personalized Prospecting Email", color: C.amber, colorLight: C.amberLight, colorBorder: C.amberBorder,
        subtitle: "Every email is built around one specific observation about the prospect, not a template with a name swapped in.",
        steps: [
          { label: "Subject Line", desc: "One observation or question tied to their specific company, role, or recent activity. Under 7 words. No 'quick question' or 'following up.' Create curiosity, not dread. Example: 'Your 6 open sales roles on LinkedIn' or 'After your Series B.'", psych: "Pattern Interrupt. A subject line that references their exact situation breaks the mental filter that deletes generic outreach immediately." },
          { label: "Personalized Opener", desc: "One sentence that proves you did homework. Reference a trigger event, a LinkedIn post, a company announcement, or a growth signal. Never start with 'I' or 'My name is.' Start with them.", psych: "Endowment Effect. When someone sees their own specific context reflected back to them, they feel more ownership over the conversation." },
          { label: "One Business Outcome", desc: "One sentence. The result you produce, not the service you offer. Tie it to revenue, retention, or time. Example: 'We help fast-growing sales teams cut rep ramp time in half by building the prospecting muscle before they ever hit the phone.'", psych: "Loss Aversion. Quantify what they are losing with every week an open seat goes unfilled or a rep underperforms." },
          { label: "Social Proof", desc: "One sentence naming a comparable company or outcome. Example: 'Enverus, FilVine, and Uscreen have all used our training programs to close skill gaps and improve rep performance within 90 days.'", psych: "Social Proof. Peer validation from recognizable names converts skepticism into curiosity faster than any claim you make about yourself." },
          { label: "Single Low-Friction CTA", desc: "One ask. Make it easy to say yes to. Not 'schedule a 30-minute call' in the first email. Try: 'Worth a 10-minute conversation this week?'", psych: "Commitment. A small yes creates psychological momentum toward a larger yes. Do not overload the first touch." },
        ]
      },
      { id: "coldcall", tag: "Cold Call Framework", title: "4-Step Cold Call Opener", color: C.teal, colorLight: C.tealLight, colorBorder: C.tealBorder,
        subtitle: "A repeatable, rubric-scored opener that establishes credibility and earns the next 60 seconds.",
        steps: [
          { label: "Step 1. Permission-Based Open", desc: "Introduce yourself, state why you are calling, and ask for permission to continue. Do not launch into a pitch. Example: 'This is [Name] from Victory Lap. I know I caught you out of the blue. I have a quick reason for calling — do you have 30 seconds?'", psych: "Reciprocity. Asking permission rather than assuming it creates a micro-agreement that makes the prospect more receptive to what follows." },
          { label: "Step 2. Social Proof Statement", desc: "One sentence establishing credibility before making any ask. Reference who you work with, not what you do. Example: 'We work with high-growth sales teams. Most recently we ran a prospecting bootcamp that moved a team's outbound meeting rate by 40% in 90 days.'", psych: "Social Proof and Authority. Naming peer companies signals legitimacy instantly and bypasses the default skepticism a cold caller faces in the first 15 seconds." },
          { label: "Step 3. Engaging Question", desc: "One open-ended problem question. Example: 'When your reps are struggling to book meetings, is the bigger issue the quality of the list, the messaging, or the actual conversation skill on the phone?' Let them answer. Do not interrupt.", psych: "Endowment Effect and Commitment. When a prospect answers a diagnostic question, they invest in the conversation and feel partial ownership over where it goes." },
          { label: "Step 4. Bridge to Next Step", desc: "Connect their answer to a specific outcome, then make one clear ask for a meeting. Example: 'That tracks with what we hear a lot. We have a framework for exactly that. Would it be worth 15 minutes to walk you through how we approached it?'", psych: "Scarcity and Loss Aversion. Frame the meeting as a chance to close a specific gap — not a demo, not a pitch." },
        ]
      },
      { id: "objection", tag: "Objection Handling Framework", title: "Acknowledge. Identify. Respond.", color: C.amber, colorLight: C.amberLight, colorBorder: C.amberBorder,
        subtitle: "A three-step process for navigating resistance without losing ground or sounding defensive.",
        steps: [
          { label: "Step 1. Acknowledge", desc: "Validate the objection before responding to it. Do not immediately counter. Show that you heard them and that the concern is reasonable. Example: 'That makes complete sense — a lot of the leaders we work with said the same thing before we connected.'", psych: "Reciprocity. Acknowledging someone's concern before countering it signals respect. People are far more open to a response from someone who first made them feel understood." },
          { label: "Step 2. Identify", desc: "Ask a clarifying question to find the real objection underneath the stated one. Most surface objections are proxies. Example: 'When you say the timing is not right, is it more of a budget issue, a bandwidth issue, or is this just not a priority right now?'", psych: "Commitment. When a prospect clarifies their own objection, they engage more deeply and often talk themselves closer to a yes." },
          { label: "Step 3. Respond", desc: "Respond specifically to what they actually said. Use social proof where possible. Tie your response to the outcome they care about. Then redirect to a next step.", psych: "Social Proof and Scarcity. A named peer who had the same objection and moved forward anyway is the most persuasive response. Pair it with the cost of inaction." },
        ]
      },
      { id: "gatekeeper", tag: "Gatekeeper Framework", title: "Gatekeeper Intel Gathering", color: C.teal, colorLight: C.tealLight, colorBorder: C.tealBorder,
        subtitle: "Treat the gatekeeper as a resource, not an obstacle. They often know more than the decision-maker shares publicly.",
        steps: [
          { label: "Do Not Lie. Do Not Dodge.", desc: "State your name and company clearly. Confidence without aggression is the right register. Example: 'This is [Name] from Victory Lap. I am hoping to connect with [Decision-Maker].'", psych: "Authority and Reciprocity. Gatekeepers respond to professionalism. Treating them with respect opens doors that pushiness closes." },
          { label: "Gather Before You Ask", desc: "Before asking to be connected, confirm: best time to reach the decision-maker, their preferred contact method, whether they own the relevant decisions, and whether there is a current vendor you should know about.", psych: "Reciprocity. Asking for their help rather than demanding a transfer positions you as respectful. Gatekeepers who feel valued share more." },
          { label: "Leave an Intel-Informed Voicemail", desc: "Use what you learned to leave a voicemail that sounds specific. Reference the company by name. Reference a real challenge. Keep it under 20 seconds and end with one clear callback ask.", psych: "Scarcity and Social Proof. A voicemail that references specifics about their company signals you are not dialing from a list. It creates curiosity." },
        ]
      },
    ];

    const psych = [
      { principle: "Reciprocity", application: "Lead every EDV cadence touch with value before making any ask. Give an insight, a benchmark, or a named proof point. Prospects who receive value first feel a natural pull to give something back." },
      { principle: "Social Proof", application: "Name companies like theirs that have seen results. Peer validation reduces perceived risk and converts skepticism into curiosity faster than any direct claim." },
      { principle: "Loss Aversion", application: "Frame the cost of inaction in the Differentiate touch and on cold calls. People avoid losses more strongly than they pursue gains. Quantify the cost of the gap, not just the value of the solution." },
      { principle: "Scarcity", application: "Reference timing as a real factor. Trigger events create legitimate urgency. A hiring surge, a leadership change, or a funding round creates a window that is genuinely time-sensitive." },
      { principle: "Endowment Effect", application: "Personalize every touch so specifically that the prospect feels the outreach was built for them. When people see their own context reflected back, they feel ownership over the conversation." },
      { principle: "Commitment", application: "Use the engaging question on cold calls to get a small yes before asking for a meeting. When prospects answer a diagnostic question, they invest in the conversation. Small commitments create momentum toward larger ones." },
    ];

    const heatmapSkills = [
      { skill: "Cold Call Opening", score: 2, zone: "hot" },
      { skill: "EDV Cadence", score: 2, zone: "hot" },
      { skill: "Personalized Email", score: 2, zone: "hot" },
      { skill: "Gatekeeper Nav", score: 3, zone: "warm" },
      { skill: "AIR Objections", score: 2, zone: "hot" },
      { skill: "Advisor Tone", score: 3, zone: "warm" },
      { skill: "Value Follow-Up", score: 2, zone: "hot" },
      { skill: "Referral Asks", score: 2, zone: "hot" },
      { skill: "LinkedIn Warm", score: 3, zone: "warm" },
      { skill: "Call-to-Meeting", score: 3, zone: "warm" },
    ];

    const sessions = [
      { num: "01", title: "Cadence, Cold Calls and Value Messaging", subtitle: "Build the system. Make the calls. Fix the message.", timeframe: "Half Day. 9:00 AM to 1:00 PM.", color: C.teal, colorLight: C.tealLight, colorBorder: C.tealBorder,
        agenda: [
          { time: "9:00 to 9:25", block: "Heat Map Reveal and Honest Baseline", detail: "Open with aggregate diagnostic results. Name the gaps directly. Set the standard: every exercise today produces something usable before you walk out of this room.", type: "opening" },
          { time: "9:25 to 10:10", block: "EDV Cadence Workshop", detail: "Build the full Educate, Differentiate, Validate sequence for your buyer. Each rep maps their current outreach on paper, identifies missing value layers, and rebuilds using the EDV framework. Every rebuilt cadence gets loaded into your CRM before the session ends.", type: "workshop" },
          { time: "10:10 to 10:50", block: "Personalized Email Writing Lab", detail: "Cover the five-part framework. Subject line, personalized opener, one business outcome, social proof, single CTA. Each rep brings their current prospecting email. We rewrite it live. Before and after read-aloud. Peers score using the email rubric.", type: "workshop" },
          { time: "10:50 to 11:05", block: "Break", detail: "", type: "break" },
          { time: "11:05 to 11:50", block: "4-Step Cold Call Opener and Gatekeeper Intel", detail: "Drill the four-step opener: permission-based open, social proof statement, engaging question, bridge to next step. Cover gatekeeper navigation — gather intel before asking for a transfer. Role play in pairs scored against the cold call rubric.", type: "lab" },
          { time: "11:50 to 12:35", block: "Live Cold Call Sprint", detail: "30 minutes of live prospecting on real prospects. Facilitator circulates and coaches in real time. Track: calls attempted, conversations started, objections hit, meetings booked. Full debrief with one immediate fix per rep.", type: "lab" },
          { time: "12:35 to 1:00", block: "Homework and Day 1 Commitments", detail: "Before Session 2: send 10 emails and log reply rates. Make 15 cold calls and log every objection. Write your differentiation answer in exactly three sentences. Bring two real objections to Session 2.", type: "closing" },
        ],
        outcomes: ["Full EDV cadence rebuilt and active in CRM for every rep.", "Prospecting email rewritten using the five-part framework.", "Cold call opener practiced and scored using the four-step rubric.", "Gatekeeper navigation and intel-gathering drilled and logged.", "15 real calls made before Session 2 with objections documented."],
      },
      { num: "02", title: "Advisor Selling, Objection Handling and Strategic Prospecting", subtitle: "Sound different. Handle anything. Build a 90-day system.", timeframe: "Half Day. 9:00 AM to 1:00 PM.", color: C.amber, colorLight: C.amberLight, colorBorder: C.amberBorder,
        agenda: [
          { time: "9:00 to 9:20", block: "Homework Debrief. Real Data, Real Patterns.", detail: "Review actual results from the week: email reply rates, call outcomes, objections hit. Identify the two to three things still breaking. Those drive today's depth.", type: "opening" },
          { time: "9:20 to 10:05", block: "AIR Objection Handling Clinic", detail: "Cover the three-step Acknowledge, Identify, Respond framework with the psychology behind each step. Drill the six most common objections in rotating pairs until the response is fluent in delivery, not just memorized on paper.", type: "workshop" },
          { time: "10:05 to 10:50", block: "Advisor-Level Selling on Cold Calls", detail: "The three-question discovery sequence: a context question, an implication question that surfaces the cost of the problem, a vision question that gets the prospect talking about success. Each rep practices live and is scored on whether the prospect feels diagnosed or pitched.", type: "workshop" },
          { time: "10:50 to 11:05", block: "Break", detail: "", type: "break" },
          { time: "11:05 to 11:40", block: "Strategic and Trigger-Based Prospecting", detail: "Stop cold prospecting when you can prospect warm. Hiring surges, leadership changes, funding announcements, Glassdoor trends — use these as opening lines. Build a live trigger event watchlist for top 20 accounts before the session ends.", type: "content" },
          { time: "11:40 to 12:15", block: "Trust Through Follow-Up and Referral Asks", detail: "The follow-up touch that builds trust versus the one that erodes it. The exact referral ask language. A mapped list of five clients and five contacts to reach for warm introductions before the end of the month.", type: "workshop" },
          { time: "12:15 to 1:00", block: "90-Day Prospecting Plan and Accountability", detail: "Each rep writes their personal plan before leaving. Weekly activity targets, top 20 accounts listed, trigger watchlist live, cadence active in CRM, AIR playbook saved. Accountability partners assigned. The one number that matters: new outbound-sourced meetings per week.", type: "closing" },
        ],
        outcomes: ["AIR objection framework applied fluently to six core objections.", "Three-question advisory discovery sequence practiced and personalized.", "Trigger event watchlist built for top 20 accounts with live alerts set.", "Referral ask scripted and mapped to five clients and five contacts.", "Written 90-day prospecting plan with targets and accountability partner named."],
      },
    ];

    function SL({ children }) {
      return <div style={{ fontFamily: "monospace", fontSize: 10, letterSpacing: 3, color: C.teal, textTransform: "uppercase", marginBottom: 18 }}>{children}</div>;
    }

    function Card({ children, style = {} }) {
      return <div style={{ background: C.faint, border: `1px solid ${C.border}`, borderRadius: 10, padding: "18px 20px", ...style }}>{children}</div>;
    }

    function Dot({ color = C.teal }) {
      return <div style={{ width: 5, height: 5, borderRadius: "50%", background: color, marginTop: 7, flexShrink: 0 }} />;
    }

    function FWCard({ fw }) {
      const [open, setOpen] = useState(false);
      return (
        <div style={{ border: `1px solid ${fw.colorBorder}`, borderRadius: 10, overflow: "hidden", marginBottom: 12 }}>
          <div onClick={() => setOpen(!open)} style={{ padding: "16px 20px", background: fw.colorLight, cursor: "pointer", display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: "monospace", fontSize: 10, letterSpacing: 2, color: fw.color, textTransform: "uppercase", marginBottom: 4 }}>{fw.tag}</div>
              <div style={{ fontWeight: 700, fontSize: 16, color: C.white }}>{fw.title}</div>
              <div style={{ fontSize: 12, color: C.muted, marginTop: 3 }}>{fw.subtitle}</div>
            </div>
            <div style={{ color: fw.color, fontSize: 16, transition: "transform 0.2s", transform: open ? "rotate(180deg)" : "none" }}>▾</div>
          </div>
          {open && (
            <div style={{ padding: "16px 20px", background: "rgba(255,255,255,0.02)", display: "flex", flexDirection: "column", gap: 12 }}>
              {fw.steps.map((step, i) => (
                <div key={i} style={{ background: C.faint, border: `1px solid ${C.border}`, borderRadius: 8, padding: "14px 16px" }}>
                  <div style={{ fontWeight: 700, fontSize: 13, color: fw.color, marginBottom: 6 }}>{step.label}</div>
                  <div style={{ fontSize: 13, color: "rgba(255,255,255,0.65)", lineHeight: 1.7, marginBottom: 8 }}>{step.desc}</div>
                  <div style={{ display: "flex", gap: 8, background: "rgba(255,255,255,0.03)", borderRadius: 6, padding: "8px 10px" }}>
                    <div style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: 1, color: C.amber, textTransform: "uppercase", marginTop: 2, flexShrink: 0 }}>Psychology</div>
                    <div style={{ fontSize: 12, color: "rgba(255,255,255,0.5)", lineHeight: 1.6 }}>{step.psych}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function HeatCell({ skill }) {
      const colors = {
        hot: { bg: C.redLight, border: C.redBorder, score: C.red, label: "PRIORITY" },
        warm: { bg: C.amberLight, border: C.amberBorder, score: C.amber, label: "SHARPEN" },
        cool: { bg: C.tealLight, border: C.tealBorder, score: C.teal, label: "MAINTAIN" },
      };
      const col = colors[skill.zone];
      return (
        <div style={{ background: col.bg, border: `1px solid ${col.border}`, borderRadius: 8, padding: "12px 8px", textAlign: "center" }}>
          <div style={{ fontSize: 10, fontWeight: 700, color: C.white, marginBottom: 5, lineHeight: 1.3 }}>{skill.skill}</div>
          <div style={{ fontFamily: "monospace", fontSize: 28, fontWeight: 800, color: col.score, lineHeight: 1 }}>{skill.score}</div>
          <div style={{ fontSize: 8, letterSpacing: 1, textTransform: "uppercase", marginTop: 3, color: col.score, opacity: 0.8 }}>{col.label}</div>
        </div>
      );
    }

    function ARow({ item }) {
      const cfg = { opening: { bg: "rgba(100,100,255,0.07)", dot: "#8888FF" }, content: { bg: "rgba(255,255,255,0.03)", dot: C.muted }, workshop: { bg: "rgba(0,180,166,0.06)", dot: C.teal }, lab: { bg: "rgba(245,166,35,0.06)", dot: C.amber }, closing: { bg: "rgba(100,100,255,0.05)", dot: "#8888FF" }, break: { bg: "transparent", dot: "transparent" } };
      const s = cfg[item.type] || cfg.content;
      if (item.type === "break") return (
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 0", opacity: 0.3 }}>
          <div style={{ fontFamily: "monospace", fontSize: 10, color: C.muted, width: 100, flexShrink: 0 }}>{item.time}</div>
          <div style={{ flex: 1, height: 1, background: C.border }} />
          <div style={{ fontSize: 10, color: C.muted }}>Break</div>
          <div style={{ flex: 1, height: 1, background: C.border }} />
        </div>
      );
      return (
        <div style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 12px", background: s.bg, borderRadius: 7 }}>
          <div style={{ fontFamily: "monospace", fontSize: 10, color: C.muted, width: 110, flexShrink: 0, paddingTop: 2 }}>{item.time}</div>
          <div style={{ width: 5, height: 5, borderRadius: "50%", background: s.dot, marginTop: 6, flexShrink: 0 }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 13, color: C.white, marginBottom: 2 }}>{item.block}</div>
            {item.detail && <div style={{ fontSize: 12, color: "rgba(255,255,255,0.52)", lineHeight: 1.65 }}>{item.detail}</div>}
          </div>
        </div>
      );
    }

    function SCard({ session }) {
      const [open, setOpen] = useState(true);
      return (
        <div style={{ border: `1px solid ${session.colorBorder}`, borderRadius: 12, overflow: "hidden", marginBottom: 20 }}>
          <div onClick={() => setOpen(!open)} style={{ padding: "20px 24px", background: session.colorLight, cursor: "pointer", display: "flex", alignItems: "center", gap: 16 }}>
            <div style={{ fontFamily: "monospace", fontSize: 46, fontWeight: 800, color: session.color, lineHeight: 1, opacity: 0.7 }}>{session.num}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: session.color, marginBottom: 4 }}>Session</div>
              <div style={{ fontSize: 18, fontWeight: 800, color: C.white }}>{session.title}</div>
              <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>{session.subtitle}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 11, color: C.muted, fontFamily: "monospace" }}>{session.timeframe}</div>
              <div style={{ color: session.color, marginTop: 8, fontSize: 16 }}>{open ? "▾" : "▸"}</div>
            </div>
          </div>
          {open && (
            <div style={{ background: "rgba(255,255,255,0.015)", padding: "20px 24px" }}>
              <div style={{ display: "flex", flexDirection: "column", gap: 5, marginBottom: 20 }}>
                {session.agenda.map((item, i) => <ARow key={i} item={item} />)}
              </div>
              <div style={{ background: session.colorLight, border: `1px solid ${session.colorBorder}`, borderRadius: 8, padding: "14px 18px" }}>
                <div style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: session.color, marginBottom: 10 }}>Session Outcomes</div>
                {session.outcomes.map((o, i) => (
                  <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 5 }}>
                    <div style={{ color: session.color, fontSize: 12, marginTop: 1, flexShrink: 0 }}>✓</div>
                    <div style={{ fontSize: 13, color: "rgba(255,255,255,0.68)", lineHeight: 1.5 }}>{o}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [tab, setTab] = useState("overview");
      const tabs = [{ id: "overview", label: "Overview" }, { id: "frameworks", label: "Frameworks" }, { id: "psychology", label: "Psychology" }, { id: "sessions", label: "Sessions" }, { id: "heatmap", label: "Heat Map" }];

      return (
        <div style={{ background: C.navy, minHeight: "100vh", color: C.white }}>
          {/* HERO */}
          <div style={{ background: `linear-gradient(135deg, ${C.navy} 0%, ${C.navyLight} 60%, #081528 100%)`, padding: "52px 40px 44px", borderBottom: `3px solid ${C.teal}` }}>
            <div style={{ maxWidth: 860, margin: "0 auto" }}>
              <div style={{ fontFamily: "monospace", fontSize: 10, letterSpacing: 4, color: C.teal, marginBottom: 16, textTransform: "uppercase" }}>Victory Lap</div>
              <div style={{ fontSize: 44, fontWeight: 900, lineHeight: 1.05, marginBottom: 10, letterSpacing: "-0.5px" }}>Prospecting Bootcamp<br /><span style={{ color: C.teal }}>and Workshop</span></div>
              <div style={{ fontSize: 15, color: C.muted, marginBottom: 36, maxWidth: 540 }}>A diagnostic-first, two-session in-person bootcamp built on proprietary frameworks and behavioral psychology. Immediate, measurable improvement in cold calling, cadence, and pipeline generation.</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 36, maxWidth: 680 }}>
                {vlProof.map((p, i) => (
                  <div key={i} style={{ background: "rgba(0,180,166,0.08)", border: `1px solid ${C.tealBorder}`, borderRadius: 8, padding: "14px 16px" }}>
                    <div style={{ fontFamily: "monospace", fontSize: 22, fontWeight: 800, color: C.teal, lineHeight: 1 }}>{p.stat}</div>
                    <div style={{ fontSize: 11, color: C.muted, marginTop: 4, lineHeight: 1.4 }}>{p.label}</div>
                  </div>
                ))}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 28 }}>
                <div style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: 2, color: C.muted, textTransform: "uppercase" }}>Trusted by</div>
                {clients.map((c, i) => <div key={i} style={{ padding: "5px 14px", background: "rgba(255,255,255,0.06)", border: `1px solid ${C.border}`, borderRadius: 20, fontSize: 12, fontWeight: 600, color: "rgba(255,255,255,0.7)" }}>{c}</div>)}
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                {["EDV Cadence", "Cold Call Mastery", "AIR Objection Handling", "Gatekeeper Intel", "Personalized Email", "Behavioral Psychology"].map((c, i) => (
                  <div key={i} style={{ padding: "5px 12px", borderRadius: 20, fontSize: 11, fontWeight: 600, background: i % 2 === 0 ? C.tealLight : C.amberLight, border: `1px solid ${i % 2 === 0 ? C.tealBorder : C.amberBorder}`, color: i % 2 === 0 ? C.teal : C.amber }}>{c}</div>
                ))}
              </div>
            </div>
          </div>

          {/* NAV */}
          <div style={{ display: "flex", padding: "0 40px", background: C.navyLight, borderBottom: `1px solid ${C.border}` }}>
            <div style={{ display: "flex", maxWidth: 860, width: "100%", margin: "0 auto" }}>
              {tabs.map(t => <button key={t.id} onClick={() => setTab(t.id)} style={{ padding: "13px 18px", background: "none", border: "none", borderBottom: tab === t.id ? `2px solid ${C.teal}` : "2px solid transparent", color: tab === t.id ? C.teal : C.muted, fontWeight: tab === t.id ? 700 : 400, fontSize: 12, cursor: "pointer" }}>{t.label}</button>)}
            </div>
          </div>

          {/* CONTENT */}
          <div style={{ padding: "36px 40px 80px", maxWidth: 860, margin: "0 auto" }}>

            {tab === "overview" && (
              <div>
                <SL>Program Structure</SL>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14, marginBottom: 36 }}>
                  {[
                    { num: "01", tag: "Pre-Work", name: "Diagnostic", desc: "Survey, call audit, and self-assessment reveal exact skill gaps. The heat map drives what gets the most floor time in each session." },
                    { num: "02", tag: "Day 1", name: "Session One", desc: "EDV cadence, personalized email, the four-step cold call opener, gatekeeper intel, and a live call sprint. Every rep leaves with rebuilt sequences active." },
                    { num: "03", tag: "Day 2", name: "Session Two", desc: "AIR objection handling, advisor-level selling, trigger-based prospecting, trust-building follow-up, and a written 90-day plan." },
                  ].map((p, i) => (
                    <Card key={i}>
                      <div style={{ fontFamily: "monospace", fontSize: 40, color: "rgba(0,180,166,0.1)", lineHeight: 1, marginBottom: 6 }}>{p.num}</div>
                      <div style={{ fontFamily: "monospace", fontSize: 9, letterSpacing: 2, color: C.amber, textTransform: "uppercase", marginBottom: 5 }}>{p.tag}</div>
                      <div style={{ fontSize: 16, fontWeight: 800, color: C.white, marginBottom: 6 }}>{p.name}</div>
                      <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.65 }}>{p.desc}</div>
                    </Card>
                  ))}
                </div>
                <SL>What Makes This Different</SL>
                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 36 }}>
                  {[
                    ["Rubrics and frameworks, not theory", "Every skill taught has a rubric. Reps score each other in the room using the same rubric managers use after the bootcamp ends."],
                    ["Live calls happen during the session", "The cold call lab and live sprint use real prospects during Session 1. Reps leave having already made calls and received real-time coaching."],
                    ["Behavioral psychology is the foundation", "Reciprocity, loss aversion, social proof, scarcity, endowment effect, and commitment are embedded inside every framework."],
                    ["Homework creates real data for Session 2", "The three to five days between sessions are not a break. Reps execute the rebuilt system in the field and return with real objections and real results."],
                    ["90-day accountability structure", "Post-bootcamp follow-through includes a bi-weekly manager review cadence, a heat map re-score at 90 days, and accountability partners assigned before reps leave."],
                  ].map(([title, body], i) => (
                    <Card key={i} style={{ display: "flex", gap: 14 }}>
                      <Dot />
                      <div>
                        <div style={{ fontWeight: 700, fontSize: 13, color: C.white, marginBottom: 3 }}>{title}</div>
                        <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.65 }}>{body}</div>
                      </div>
                    </Card>
                  ))}
                </div>
                <div style={{ background: "linear-gradient(135deg, rgba(0,180,166,0.12), rgba(0,180,166,0.04))", border: `1px solid ${C.tealBorder}`, borderRadius: 12, padding: "32px 36px", textAlign: "center" }}>
                  <div style={{ fontFamily: "monospace", fontSize: 10, letterSpacing: 3, color: C.teal, textTransform: "uppercase", marginBottom: 12 }}>Ready to Run This for Your Team</div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: C.white, marginBottom: 8 }}>Book a Bootcamp with Victory Lap</div>
                  <div style={{ fontSize: 13, color: C.muted, marginBottom: 24, maxWidth: 440, margin: "0 auto 24px" }}>We run diagnostics first, build the program around your team's actual skill gaps, and deliver measurable improvement in outbound meeting rates within 90 days.</div>
                  <a href="mailto:brian@victorylap.com" style={{ display: "inline-block", padding: "14px 32px", background: C.teal, color: C.navy, fontWeight: 800, fontSize: 14, borderRadius: 8, textDecoration: "none" }}>Talk to Victory Lap</a>
                </div>
              </div>
            )}

            {tab === "frameworks" && (
              <div>
                <SL>Core Frameworks and Rubrics</SL>
                <div style={{ fontSize: 13, color: C.muted, marginBottom: 24, lineHeight: 1.65 }}>Every framework is rubric-scored and immediately replicable. Reps do not leave with notes. They leave with a tool they practiced and a rubric they can use to evaluate themselves and each other after the session ends.</div>
                {frameworks.map((fw, i) => <FWCard key={i} fw={fw} />)}
              </div>
            )}

            {tab === "psychology" && (
              <div>
                <SL>Behavioral Psychology in Prospecting</SL>
                <div style={{ fontSize: 13, color: C.muted, marginBottom: 28, lineHeight: 1.65 }}>Every framework in this bootcamp is built on a psychological principle. Reps who internalize the principle become advisors. Reps who only memorize the script sound like it.</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 36 }}>
                  {psych.map((p, i) => (
                    <Card key={i} style={{ display: "flex", gap: 16 }}>
                      <div style={{ width: 110, flexShrink: 0, fontFamily: "monospace", fontSize: 10, color: C.teal, textTransform: "uppercase", letterSpacing: 1, fontWeight: 700, paddingTop: 2 }}>{p.principle}</div>
                      <div style={{ fontSize: 13, color: "rgba(255,255,255,0.65)", lineHeight: 1.65 }}>{p.application}</div>
                    </Card>
                  ))}
                </div>
                <SL>Where Each Principle Appears</SL>
                <div style={{ background: C.faint, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", background: "rgba(0,180,166,0.08)", borderBottom: `1px solid ${C.border}` }}>
                    {["Principle", "Primary Framework", "Trigger"].map((h, i) => <div key={i} style={{ padding: "10px 14px", fontFamily: "monospace", fontSize: 9, letterSpacing: 1, textTransform: "uppercase", color: C.teal }}>{h}</div>)}
                  </div>
                  {[
                    ["Reciprocity", "EDV Cadence. Educate touch.", "Lead with value before any ask on the first touch."],
                    ["Social Proof", "EDV Cadence. Validate touch. Cold call Step 2.", "Name peer companies when establishing credibility."],
                    ["Loss Aversion", "EDV Cadence. Differentiate touch. AIR Step 3.", "Quantify the cost of a bad hire or an underperforming rep."],
                    ["Scarcity", "Personalized email body. Cold call Step 4.", "Tie urgency to a real trigger event in the prospect's context."],
                    ["Endowment Effect", "Personalized email opener. Gatekeeper intel.", "Reference their specific company, role, or recent news."],
                    ["Commitment", "Cold call Step 3. AIR Step 2.", "Ask a diagnostic question that earns a small yes before asking for a meeting."],
                  ].map((row, i) => (
                    <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", borderBottom: i < 5 ? `1px solid ${C.border}` : "none", background: i % 2 === 0 ? "transparent" : "rgba(255,255,255,0.02)" }}>
                      {row.map((cell, j) => <div key={j} style={{ padding: "10px 14px", fontSize: 12, color: j === 0 ? C.amber : "rgba(255,255,255,0.62)", fontWeight: j === 0 ? 700 : 400 }}>{cell}</div>)}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === "sessions" && (
              <div>
                <SL>In-Person Workshop Sessions</SL>
                <div style={{ fontSize: 13, color: C.muted, marginBottom: 24, lineHeight: 1.65 }}>Two half-day sessions held three to five days apart. Session 1 builds and activates the system. Homework executes the system. Session 2 sharpens execution based on what actually broke in the field.</div>
                {sessions.map((s, i) => <SCard key={i} session={s} />)}
              </div>
            )}

            {tab === "heatmap" && (
              <div>
                <SL>Skill Gap Heat Map</SL>
                <div style={{ fontSize: 13, color: C.muted, marginBottom: 22, lineHeight: 1.65 }}>The diagnostic runs before Session 1. Every participant completes a self-assessment across 10 prospecting skills scored 1 to 5. The aggregate heat map is revealed at the start of Session 1 and drives what gets the most floor time.</div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8, marginBottom: 14 }}>
                  {heatmapSkills.map((s, i) => <HeatCell key={i} skill={s} />)}
                </div>
                <div style={{ display: "flex", gap: 18, marginBottom: 32 }}>
                  {[{ bg: C.redLight, border: C.redBorder, label: "Priority Fix. Scores 1 to 2." }, { bg: C.amberLight, border: C.amberBorder, label: "Sharpen. Score 3." }, { bg: C.tealLight, border: C.tealBorder, label: "Maintain. Scores 4 to 5." }].map((l, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 7 }}>
                      <div style={{ width: 10, height: 10, borderRadius: 2, background: l.bg, border: `1px solid ${l.border}` }} />
                      <div style={{ fontSize: 11, color: C.muted }}>{l.label}</div>
                    </div>
                  ))}
                </div>
                <SL>What the Heat Map Produces</SL>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {[
                    ["A session agenda driven by real data", "Red zones get the most floor time. Green skills get compressed. No guessing about what to prioritize."],
                    ["Individual coaching plans for 90 days", "Each rep's personal map becomes the manager's coaching agenda. One red zone per rep per month."],
                    ["A measurable baseline to compare against", "The same self-assessment runs again at 90 days. Movement out of red is the clearest signal the training produced real behavior change."],
                    ["Early identification of outliers", "If one rep scores significantly lower than peers on a skill, they need a targeted coaching track alongside the group session."],
                  ].map(([title, body], i) => (
                    <Card key={i} style={{ display: "flex", gap: 12 }}>
                      <Dot />
                      <div>
                        <div style={{ fontWeight: 700, fontSize: 13, color: C.white, marginBottom: 2 }}>{title}</div>
                        <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.6 }}>{body}</div>
                      </div>
                    </Card>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* FOOTER */}
          <div style={{ borderTop: `1px solid ${C.border}`, padding: "24px 40px", background: C.navyLight, textAlign: "center" }}>
            <div style={{ fontSize: 12, color: C.muted }}>Victory Lap. 10 years coaching and developing B2B sellers. 1,000+ placements. 400+ client companies.</div>
            <a href="mailto:brian@victorylap.com" style={{ fontSize: 12, color: C.teal, textDecoration: "none", marginTop: 4, display: "block" }}>brian@victorylap.com</a>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
